plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.tcl.netflixbutton2tv'
    compileSdk 35

    defaultConfig {
        applicationId 'pl.tcl.netflixbutton2tv'
        minSdk 28
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
