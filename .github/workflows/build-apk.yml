name: Build Android TV APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted ubuntu runners already contain Android SDK.
      # Do not run android-actions/setup-android@v3 here: its default
      # 'sdkmanager tools' installation fails (obsolete SDK package).
      - name: Android SDK API 35 and Build Tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            echo "SDK manager not found: $SDK_MANAGER"
            exit 1
          fi
          "$SDK_MANAGER" --version
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TCL-Netflix-Button-To-TV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
